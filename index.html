<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão da Oficina</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f5f8;--bg2:#eceef3;--card:#ffffff;--ink:#14161c;--ink2:#4a5060;--ink3:#8a90a0;--line:#e3e6ed;
  --pri:#2f6bff;--pri2:#e8efff;--ok:#12a150;--ok2:#e3f6ec;--warn:#d98a00;--warn2:#fff4dc;--bad:#e5484d;--bad2:#fde8e8;
  --side:#11141b;--side-ink:#c9cede;--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f14;--bg2:#151821;--card:#171a22;--ink:#eef0f5;--ink2:#b3b9c9;--ink3:#7c8396;--line:#262a35;
  --pri:#5b8cff;--pri2:#1c2640;--ok:#2ec770;--ok2:#12291d;--warn:#f0a92a;--warn2:#2e2310;--bad:#ff6b6f;--bad2:#341819;
  --side:#0a0c10;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0d0f14;--bg2:#151821;--card:#171a22;--ink:#eef0f5;--ink2:#b3b9c9;--ink3:#7c8396;--line:#262a35;
  --pri:#5b8cff;--pri2:#1c2640;--ok:#2ec770;--ok2:#12291d;--warn:#f0a92a;--warn2:#2e2310;--bad:#ff6b6f;--bad2:#341819;
  --side:#0a0c10;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#8b5cf6);display:grid;place-items:center;box-shadow:0 6px 18px rgba(47,107,255,.35)}
.brand .logo svg{color:#fff}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--side-ink);opacity:.7}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:color .2s}
.nav button:hover{color:#fff}
.nav button.on{color:#fff}
.nav .pill{position:absolute;left:0;right:0;height:40px;border-radius:10px;background:rgba(255,255,255,.08);transition:transform .35s var(--ease);z-index:0}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side .foot button{background:none;border:1px solid rgba(255,255,255,.15);color:var(--side-ink);border-radius:8px;padding:6px 10px;cursor:pointer}
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px}
.top .sub{color:var(--ink3);font-size:12.5px}
.top .grow{flex:1}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.month button{border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--ink2)}
.month button:hover{background:var(--bg2)}
.month span{min-width:118px;text-align:center;font-weight:600;text-transform:capitalize}
#view{padding:24px 28px 100px;max-width:1280px;width:100%}
.bottom{display:none}

/* ---------- components ---------- */
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2b{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:500;color:var(--ink3);font-size:12.5px}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{color:var(--ink3);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.4px}
.kpi .hint{font-size:12px;color:var(--ink3);margin-top:2px}
.kpi .ico{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.t-pri{background:var(--pri2);color:var(--pri)}.t-ok{background:var(--ok2);color:var(--ok)}.t-warn{background:var(--warn2);color:var(--warn)}.t-bad{background:var(--bad2);color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550;white-space:nowrap;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:6px;border-radius:8px}
.btn.danger{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:none;transition:border .15s,box-shadow .15s}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
.search{position:relative;min-width:220px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search .in{padding-left:34px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:550}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.peca_cliente{background:var(--pri2);color:var(--pri)}
.tag.oleo_estoque{background:var(--warn2);color:var(--warn)}
.tag.servico_terceiro{background:color-mix(in srgb,#8b5cf6 15%,transparent);color:#8b5cf6}
.st{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.pago{color:var(--ok)}.st.aberto{color:var(--pri)}.st.vencido{color:var(--bad)}.st.fechar{color:var(--warn)}.st.neutro{color:var(--ink3)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.muted{color:var(--ink3)}
.right,.tbl .right{text-align:right}
.empty{text-align:center;padding:40px 10px;color:var(--ink3)}
.empty svg{width:40px;height:40px;stroke-width:1.5;margin-bottom:8px;opacity:.6}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:12px;color:var(--ink3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--bg2)}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl .acts .btn{opacity:.55}
.tbl tr:hover .acts .btn{opacity:1}
.tbl .grp td{background:var(--bg2);font-weight:650;font-size:12.5px;color:var(--ink2);padding:6px 10px}
.scroll{overflow-x:auto}

/* bars */
.hbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar .tr{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.hbar .fl{height:100%;border-radius:99px;transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.prog{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#8b5cf6);border-radius:99px;transform-origin:left;animation:grow 1s var(--ease) both}

/* list items (contas) */
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{width:54px;text-align:center;border-radius:10px;padding:5px 0;font-weight:700;line-height:1.1;flex:none}
.li .when small{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;opacity:.8}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid span{font-size:12.5px;color:var(--ink3)}
.li .v{font-weight:700;white-space:nowrap}

/* tabs */
.tabs{display:inline-flex;background:var(--bg2);border-radius:12px;padding:4px;gap:2px;margin-bottom:16px;position:relative}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink2);position:relative;z-index:1;transition:color .2s}
.tabs button.on{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,12,18,.45);backdrop-filter:blur(3px);animation:fade .2s both}
#modal .sheet{background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .28s var(--ease) both}
#modal .sheet.wide{width:min(1100px,100%)}
#modal .hd{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
#modal .hd h2{margin:0;font-size:17px;flex:1}
#modal .bd{padding:20px;overflow:auto}
#modal .ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}

/* toasts */
#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;animation:tin .35s var(--ease) both;max-width:380px}
.toast.bad{background:var(--bad);color:#fff}
.toast button{background:none;border:0;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.toast.out{animation:tout .3s ease both}
@keyframes tin{from{opacity:0;transform:translateY(16px)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}

/* view animation */
.enter>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* dropzone */
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center;transition:all .2s;background:var(--bg2)}
.drop.over{border-color:var(--pri);background:var(--pri2);transform:scale(1.01)}
.drop>svg{width:38px;height:38px;color:var(--pri);stroke-width:1.6}
.drop p{margin:8px 0 14px;color:var(--ink2)}

/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--pri) 25%,transparent),transparent),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,#8b5cf6 22%,transparent),transparent),var(--bg)}
#auth .card{width:min(400px,100%);padding:30px;animation:pop .4s var(--ease) both}
#auth h2{margin:14px 0 4px;font-size:22px}
#auth .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--pri),#8b5cf6);display:grid;place-items:center;color:#fff}
#auth form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.msg{font-size:13px;padding:9px 12px;border-radius:10px;background:var(--bg2)}
.msg.bad{background:var(--bad2);color:var(--bad)}.msg.ok{background:var(--ok2);color:var(--ok)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:80px;color:var(--ink3)}
.mecard .val{font-size:22px;font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.sep{height:1px;background:var(--line);margin:14px 0}

@media (max-width:1000px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.k3{grid-template-columns:1fr}}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}
  .top h1{font-size:18px}
  #view{padding:16px 16px 110px}
  .k4{grid-template-columns:1fr 1fr}
  .k2,.k2b{grid-template-columns:1fr}
  .kpi .val{font-size:19px}
  .kpi .ico{width:30px;height:30px;right:10px;top:10px}
  .form{grid-template-columns:1fr}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink3);padding:4px 6px;border-radius:10px;cursor:pointer;transition:color .2s}
  .bottom button.on{color:var(--pri)}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .tbl.cards td{border:0;padding:0}
  .tbl.cards td.hide-m{display:none}
  .tbl.cards .grp{display:block;padding:0}
  .tbl.cards .grp td{display:block}
  .search{min-width:0;flex:1}
  #toasts{left:16px;right:16px;bottom:80px;align-items:stretch}
  .hbar{grid-template-columns:80px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>
    <h2>Gestão da Oficina</h2>
    <div class="muted">Entre com seu e-mail e senha.</div>
    <form id="authForm">
      <label class="f">E-mail<input class="in" type="email" name="email" required autocomplete="email"></label>
      <label class="f">Senha<input class="in" type="password" name="senha" required minlength="6" autocomplete="current-password"></label>
      <div id="authMsg" class="msg" hidden></div>
      <button class="btn pri" style="justify-content:center" type="submit">Entrar</button>
      <button class="btn ghost" type="button" id="btnSignup" style="justify-content:center">Primeiro acesso? Criar conta</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div><div>Oficina<small>Gestão financeira</small></div></div>
    <nav class="nav" id="nav"><div class="pill" id="pill"></div></nav>
    <div class="foot"><span id="who"></span><button id="btnTheme">Alternar tema</button><button id="btnOut">Sair</button></div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title">Início</h1><div class="sub" id="subtitle"></div></div>
      <div class="grow"></div>
      <div class="month" id="month"><button data-m="-1" aria-label="Mês anterior"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span id="monthLbl"></span><button data-m="1" aria-label="Próximo mês"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
    </header>
    <section id="view"></section>
  </main>
  <nav class="bottom" id="bottom"></nav>
</div>

<div id="modal" hidden></div>
<div id="toasts"></div>

<script>
/* ================= CONFIG ================= */

async function ins(t,rows){
  const arr=Array.isArray(rows)?rows:[rows];if(!arr.length)return[];
  const{data,error}=await sb.from(t).insert(arr).select();
  if(error)throw error;S[t].push(...data);return data;
}
async function upd(t,id,patch){
  const{data,error}=await sb.from(t).update(patch).eq('id',id).select().single();
  if(error)throw error;const i=S[t].findIndex(x=>x.id===id);if(i>=0)S[t][i]=data;return data;
}

function notaStatus(n){
  if(n.devolucao)return{c:'neutro',t:'Devolução'};
  const f=F(n.fornecedor_id);
  if(n.fechamento_id){const fe=S.fechamentos.find(x=>x.id===n.fechamento_id);return fe?.pago_em?{c:'pago',t:'Pago'}:{c:'aberto',t:'Em fechamento'}}
  const ds=S.duplicatas.filter(d=>d.nota_id===n.id);
  if(ds.length){
    if(ds.every(d=>d.pago_em))return{c:'pago',t:'Pago'};
    if(ds.some(d=>!d.pago_em&&d.vencimento<today()))return{c:'vencido',t:'Vencido'};
    return{c:'aberto',t:'Em aberto'};
  }
  if(n.quitada)return{c:'pago',t:'Pago'};
  if(f?.modo_cobranca==='fechamento')return{c:'fechar',t:'A fechar'};
  return{c:'neutro',t:'Sem boleto'};
}
function aPagar(){
  const L=[];
  for(const d of S.duplicatas){if(d.pago_em)continue;const n=S.notas.find(x=>x.id===d.nota_id);if(!n)continue;const f=F(n.fornecedor_id);

  for(const fe of S.fechamentos){if(fe.pago_em)continue;const f=F(fe.fornecedor_id);const q=S.notas.filter(n=>n.fechamento_id===fe.id).length;
    L.push({k:'fechamentos',id:fe.id,venc:fe.vencimento,valor:+fe.valor,t:f?.nome||'Fechamento',s:`Fechamento · ${q} nota${q==1?'':'s'}${fe.descricao?' · '+fe.descricao:''}`,cor:fornCor(f),tipo:'Fechamento'})}
  for(const p of S.parcelamentos){if(!p.ativo||!p.proximo_vencimento)continue;
    L.push({k:'parcelamentos',id:p.id,venc:p.proximo_vencimento,valor:+p.valor_parcela,t:p.descricao,s:`Parcela ${p.parcelas_pagas+1} de ${p.total_parcelas}`,cor:'#8b5cf6',tipo:'Parcela'})}
  for(const d of S.despesas){if(d.pago_em)continue;L.push({k:'despesas',id:d.id,venc:d.vencimento,valor:+d.valor,t:d.descricao,s:'Despesa',cor:'#64748b',tipo:'Despesa'})}
  return L.sort((a,b)=>a.venc.localeCompare(b.venc));
}
function pctFor(mecId,data){
  const pick=a=>a.filter(c=>c.vigente_desde<=data).sort((x,y)=>y.vigente_desde.localeCompare(x.vigente_desde))[0];
  return +(pick(S.comissoes.filter(c=>c.mecanico_id===mecId))||pick(S.comissoes.filter(c=>!c.mecanico_id))||{percentual:12}).percentual;
}
function producaoMes(m){
  const R={};S.mecanicos.forEach(x=>R[x.id]={mec:x,total:0,com:0,qtd:0});
  for(const p of S.producao.filter(p=>inMes(p.data,m))){
    const share=+p.valor/p.mecanico_ids.length;
    for(const id of p.mecanico_ids){if(!R[id])continue;R[id].total+=share;R[id].com+=share*pctFor(id,p.data)/100;R[id].qtd++}
  }
  return Object.values(R);
}

function dueTxt(v){const d=diff(v);return d<0?`<span style="color:var(--bad)">venceu há ${-d} dia${d==-1?'':'s'}</span>`:d===0?'<span style="color:var(--warn)">vence hoje</span>':d===1?'vence amanhã':`em ${d} dias`}
function contaLi(x){return`<div class="li">${whenBox(x.venc)}<div class="mid"><b><span class="dot" style="background:${x.cor};margin-right:6px"></span>${esc(x.t)}</b><span>${esc(x.s)} · ${dueTxt(x.venc)}</span></div><div class="v num">${brl(x.valor)}</div><button class="btn sm ok" data-act="pagar" data-k="${x.k}" data-id="${x.id}">${ic('check')}Pagar</button></div>`}

/* ---------- XML IMPORT ---------- */
function importXml(){
  modal('Importar notas (XML)',`
   <div class="drop" id="drop">${ic('up')}<p>Arraste aqui os <b>XMLs</b>, uma <b>pasta</b> ou um <b>.zip</b></p>
   <div class="row" style="justify-content:center;flex-wrap:wrap"><label class="btn pri">${ic('nota')}Escolher arquivos<input type="file" id="xf" multiple accept=".xml,.zip" hidden></label><label class="btn">${ic('layers')}Escolher pasta<input type="file" id="xd" webkitdirectory hidden></label></div></div>
   <div id="xres" style="margin-top:16px"></div>`,null,{wide:true,noFoot:true});
  const dz=$('#drop');
  ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',async ev=>{const fs=await filesFromDrop(ev.dataTransfer);handleXmlFiles(fs)});
  $('#xf').onchange=e=>handleXmlFiles([...e.target.files]);
  $('#xd').onchange=e=>handleXmlFiles([...e.target.files]);
}
async function filesFromDrop(dt){
  const items=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!items.length)return[...dt.files];
  const out=[];
  const walk=async e=>{if(e.isFile){out.push(await new Promise(r=>e.file(r)))}else if(e.isDirectory){const rd=e.createReader();let batch;do{batch=await new Promise(r=>rd.readEntries(r));for(const x of batch)await walk(x)}while(batch.length)}};
  for(const e of items)await walk(e);return out;
}
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),out=[];
  let eocd=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)return out;
  let p=dv.getUint32(eocd+16,true);const n=dv.getUint16(eocd+10,true);
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(name.endsWith('/'))continue;
    const lnl=dv.getUint16(off+26,true),lxl=dv.getUint16(off+28,true);const data=u8.subarray(off+30+lnl+lxl,off+30+lnl+lxl+csize);
    let bytes;
    if(method===0)bytes=data;else if(method===8){bytes=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else continue;
    out.push({name,bytes});
  }
  return out;
}
function parseNFe(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const g=(el,t)=>el?.getElementsByTagNameNS('*',t)[0]||el?.getElementsByTagName(t)[0];
  const tx=(el,t)=>g(el,t)?.textContent?.trim()||'';
  const inf=g(doc,'infNFe');if(!inf)return null;
  const ide=g(inf,'ide'),emit=g(inf,'emit');
  const natOp=tx(ide,'natOp'),fin=tx(ide,'finNFe');
  const itens=[...inf.getElementsByTagNameNS('*','det')].map(d=>{const p=g(d,'prod');return{c:tx(p,'cProd'),d:tx(p,'xProd'),q:+tx(p,'qCom')||null,u:tx(p,'uCom'),v:+tx(p,'vProd')||0}});
  const dups=[...inf.getElementsByTagNameNS('*','dup')].map(d=>({numero:tx(d,'nDup'),vencimento:tx(d,'dVenc'),valor:+tx(d,'vDup')||0})).filter(d=>d.vencimento);
  return{
    chave:(inf.getAttribute('Id')||'').replace(/^NFe/,'')||null,
    numero:tx(ide,'nNF'),data:(tx(ide,'dhEmi')||tx(ide,'dEmi')).slice(0,10),
    cnpj:onlyDig(tx(emit,'CNPJ')||tx(emit,'CPF')),nome:tx(emit,'xNome'),fant:tx(emit,'xFant'),
    valor:+tx(g(inf,'ICMSTot'),'vNF')||sum(itens,i=>i.v),
    devolucao:fin==='4'||/DEVOL/i.test(norm(natOp)),natOp,itens,dups
  };
}
function detectForn(x){
  const c=x.cnpj;const raiz=c.slice(0,8);
  let f=S.fornecedores.find(f=>(f.cnpjs||[]).some(k=>onlyDig(k)===c));
  if(!f&&raiz)f=S.fornecedores.find(f=>(f.cnpjs||[]).some(k=>onlyDig(k).slice(0,8)===raiz));
  if(!f){const nm=norm(x.nome+' '+x.fant);f=S.fornecedores.find(f=>(f.palavras||[]).concat(f.nome).some(p=>p&&nm.includes(norm(p))))}
  return f;
}
function guessCat(x,f){
  if(x.itens.length&&x.itens.every(i=>/OLEO|LUBRIF|FILTRO/.test(norm(i.d))))return'oleo_estoque';
  if(f&&SEED_FORN.find(s=>s[0]===f.nome&&s[2]))return SEED_FORN.find(s=>s[0]===f.nome)[2];
  return'peca_cliente';
}
let XQ=[];
async function handleXmlFiles(files){
  const box=$('#xres');box.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  const texts=[];
  for(const f of files){
    const nm=f.name.toLowerCase();
    try{
      if(nm.endsWith('.zip')){for(const z of await unzip(await f.arrayBuffer()))if(z.name.toLowerCase().endsWith('.xml'))texts.push(new TextDecoder().decode(z.bytes))}
      else if(nm.endsWith('.xml'))texts.push(await f.text());
    }catch(e){console.warn(e)}
  }
  const seen=new Set();XQ=[];
  for(const t of texts){const x=parseNFe(t);if(!x)continue;if(x.chave&&seen.has(x.chave))continue;if(x.chave)seen.add(x.chave);
    x.dup=!!(x.chave&&S.notas.some(n=>n.chave===x.chave));
    const f=detectForn(x);x.forn=f?.id||'';x.cat=guessCat(x,f);x.on=!x.dup&&!x.devolucao;x.cli='';x.car='';x.os='';XQ.push(x)}
  XQ.sort((a,b)=>a.data.localeCompare(b.data));
  drawXQ();
}
function drawXQ(){
  const box=$('#xres');
  if(!XQ.length){box.innerHTML=empty('alert','Nenhuma NF-e encontrada nesses arquivos.');return}
  const ok=XQ.filter(x=>x.on);
  box.innerHTML=`<div class="bar"><b>${XQ.length} nota${XQ.length==1?'':'s'} lida${XQ.length==1?'':'s'}</b><span class="muted">${XQ.filter(x=>x.dup).length} já cadastrada(s) · ${XQ.filter(x=>x.devolucao).length} devolução(ões)</span><div class="grow"></div><b class="num">${ok.length} selecionada(s) · ${brl(sum(ok,x=>x.valor))}</b></div>

  ${XQ.map((x,i)=>`<tr style="${x.dup||x.devolucao?'opacity:.55':''}">

async function saveXQ(){
  const sel=XQ.filter(x=>x.on);
  if(sel.some(x=>!x.forn))return toast('Escolha a autopeça de todas as notas selecionadas.',true);
  const b=$('#xSave');b.disabled=true;b.innerHTML='<span class="spin"></span> Salvando…';
  try{
    // aprende CNPJs novos
    const learn={};sel.forEach(x=>{const f=F(x.forn);if(x.cnpj&&!(f.cnpjs||[]).includes(x.cnpj))(learn[f.id]=learn[f.id]||new Set(f.cnpjs||[])).add(x.cnpj)});
    for(const[id,set]of Object.entries(learn))await upd('fornecedores',id,{cnpjs:[...set]});
    const rows=sel.map(x=>({fornecedor_id:x.forn,emitente_nome:x.fant||x.nome,emitente_cnpj:x.cnpj,numero:x.numero,chave:x.chave,data_emissao:x.data,valor:x.valor,categoria:x.cat,cliente:(x.cli||'').toUpperCase()||null,carro:(x.car||'').toUpperCase()||null,origem:'xml',devolucao:x.devolucao,itens:x.itens}));
    const saved=await ins('notas',rows);
    const dups=[];
    saved.forEach((n,i)=>{const x=sel[i],f=F(n.fornecedor_id);if(n.devolucao||f.modo_cobranca!=='boleto')return;
      if(x.dups.length)x.dups.forEach(d=>dups.push({nota_id:n.id,numero:d.numero,vencimento:d.vencimento,valor:d.valor}));
      else dups.push({nota_id:n.id,vencimento:addDays(n.data_emissao,f.prazo_dias),valor:n.valor})});
    await ins('duplicatas',dups);
    closeModal();toast(`${saved.length} nota${saved.length==1?'':'s'} salva${saved.length==1?'':'s'}.`);
    if(saved[0])MES=saved[saved.length-1].data_emissao.slice(0,7);
    render();
  }catch(e){toast(errMsg(e),true);b.disabled=false;b.textContent='Tentar de novo'}
}

function copiarDiario(){

  if(!dias.length)return toast('Nada lançado neste mês.',true);
  modal('Copiar para a aba DIARIO',`<div class="form"><label class="f">De<input class="in" type="date" id="cdA" value="${dias[0]}"></label><label class="f">Até<input class="in" type="date" id="cdB" value="${dias[dias.length-1]}"></label></div>
   <p class="muted" style="font-size:13px">Uma linha por O.S. (ou cliente/dia, para notas sem O.S.), com as colunas DATA, CLIENTE, ${COLUNAS_DIARIO.join(', ')}, IMPOSTO, ESTOQUE. Cole na coluna A da primeira linha vazia do DIARIO.</p><div id="cdPrev"></div>`,
  async()=>{const t=diarioTSV($('#cdA').value,$('#cdB').value);if(!t.n)throw new Error('Nada nesse período.');await copyText(t.tsv);toast(`${t.n} linha${t.n==1?'':'s'} copiada${t.n==1?'':'s'}. Cole no Excel.`)},{ok:'Copiar'});
  const prev=()=>{const t=diarioTSV($('#cdA').value,$('#cdB').value);$('#cdPrev').innerHTML=`<div class="scroll"><table class="tbl" style="font-size:12.5px"><thead><tr><th>Data</th><th>Cliente</th>${COLUNAS_DIARIO.map(c=>`<th class="right">${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td>${r.slice(2,2+COLUNAS_DIARIO.length).map(v=>`<td class="right num">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
  $('#cdA').onchange=prev;$('#cdB').onchange=prev;prev();
}
function diarioTSV(a,b){
  const c=cfg();const colDe=n=>{const f=F(n.fornecedor_id);return COLUNAS_DIARIO.find(x=>norm(x)===norm(f?.nome))||'DIVERSOS'};
  const g=[];
  for(const o of S.ordens.filter(o=>o.data>=a&&o.data<=b)){
    const v={};notasDaOS(o).filter(pecaNota).forEach(n=>{const k=colDe(n);v[k]=(v[k]||0)+ +n.valor});
    const imp=cartaoDe(o)*c.impostoDiario/100,est=oleoCusto(o);
    if(Object.keys(v).length||imp||est)g.push({d:o.data,cli:[o.cliente,o.carro].filter(Boolean).join(' '),v,imp,est});
  }
  const m=new Map();
  for(const n of S.notas.filter(n=>!n.ordem_id&&n.data_emissao>=a&&n.data_emissao<=b&&pecaNota(n))){
    const cli=[n.cliente,n.carro].filter(Boolean).join(' ')||'SEM CLIENTE';const k=n.data_emissao+'|'+cli;
    if(!m.has(k))m.set(k,{d:n.data_emissao,cli,v:{},imp:0,est:0});const r=m.get(k),cc=colDe(n);r.v[cc]=(r.v[cc]||0)+ +n.valor}
  g.push(...m.values());
  const rows=g.sort((x,y)=>x.d.localeCompare(y.d)).map(r=>[fd(r.d),r.cli,...COLUNAS_DIARIO.map(k=>r.v[k]?v2(r.v[k]):''),r.imp?v2(r.imp):'',r.est?v2(r.est):'']);
  return{rows,n:rows.length,tsv:rows.map(r=>r.join('\t')).join('\r\n')};
}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}

const CFG_PADRAO={oleos:{'0W20':40,'5W20':38,'5W30':32,'5W40':44,'10W40':30,'15W40':31,'20W50':20},filtro:15,impostoDiario:10,impostoMensal:10.27,taxaPct:0,custoFixo:2500};
function cfg(){const r=S.config.find(c=>c.chave==='custos');return{...CFG_PADRAO,...(r?.valor||{}),oleos:{...(r?.valor?.oleos||CFG_PADRAO.oleos)}}}
async function setCfg(v){const{data,error}=await sb.from('config').upsert({chave:'custos',valor:v}).select().single();if(error)throw error;S.config=S.config.filter(c=>c.chave!=='custos');S.config.push(data)}
let DIA=today();
const movValido=m=>!/CANCEL|ESTORN|RECUS|NEGAD|DEVOLV|CHARGEBACK|CONTEST/.test(norm(m.status));
const ehCartao=m=>!/PIX|BOLETO|SALDO|DINHEIRO/.test(norm(m.meio));
function oleoCusto(o){const c=cfg();return sum(o.oleo||[],l=>(+l.litros||0)*(+c.oleos[l.tipo]||0))+(+o.filtros||0)*c.filtro}
function cartaoDe(o){const ms=S.cartao_mov.filter(m=>m.ordem_id===o.id&&movValido(m));return ms.length?sum(ms.filter(ehCartao),m=>m.bruto):+o.cartao||0}
function taxaDe(o){const ms=S.cartao_mov.filter(m=>m.ordem_id===o.id&&movValido(m));if(ms.length)return sum(ms,m=>m.taxa);return o.taxa!=null?+o.taxa:(+o.cartao||0)*cfg().taxaPct/100}
const notasDaOS=o=>S.notas.filter(n=>n.ordem_id===o.id&&!n.devolucao);
const pecaNota=n=>!n.devolucao&&n.categoria!=='oleo_estoque';
function resumoDia(d){
  const c=cfg();
  const os=S.ordens.filter(o=>o.data===d);
  const ns=S.notas.filter(n=>n.data_emissao===d);
  const movs=S.cartao_mov.filter(m=>m.data===d&&movValido(m));
  const venda=sum(os,o=>o.valor_total);
  const peca=sum(ns.filter(pecaNota),n=>n.valor);
  const oleo=sum(os,oleoCusto);
  const cartao=movs.length?sum(movs.filter(ehCartao),m=>m.bruto):sum(os,o=>o.cartao);
  const taxa=movs.length?sum(movs,m=>m.taxa):sum(os,taxaDe);
  const imposto=cartao*c.impostoMensal/100;
  return{os,ns,movs,venda,peca,oleo,cartao,taxa,imposto,lucro:venda-peca-oleo-taxa-imposto-c.custoFixo,fonteCartao:movs.length?'PagBank':'O.S.'};
}
const v2=n=>n2(n).replace(/\./g,'');
function mensalTSV(d){const r=resumoDia(d);return[fd(d),v2(r.venda),v2(r.peca),v2(r.oleo),v2(r.taxa),v2(r.imposto)].join('\t')}

/* PagBank: lê o CSV de vendas e reconhece as colunas pelo nome */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const sep=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseData(s){s=String(s||'').trim();let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return`${m[3]}-${m[2]}-${m[1]}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{2})-(\d{2})-(\d{4})/);if(m)return`${m[3]}-${m[2]}-${m[1]}`;return null}
function lerPagBank(text){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>r.filter(c=>/DATA|VALOR|STATUS|TAXA/.test(norm(c))).length>=2);
  if(hi<0)throw new Error('Não reconheci as colunas desse arquivo. Me mande um exemplo para eu ajustar.');
  const H=rows[hi].map(norm);
  const col=(...res)=>{for(const re of res){const i=H.findIndex(h=>re.test(h));if(i>=0)return i}return-1};
  const C={data:col(/^DATA (DA )?(VENDA|TRANSACAO)/,/^DATA/),bruto:col(/VALOR BRUTO/,/VALOR (DA )?(VENDA|TRANSACAO)/,/VALOR ORIGINAL/,/^VALOR$/),taxa:col(/^TAXA/,/TARIFA/,/VALOR (DA )?TAXA/,/DESCONTO/),liq:col(/LIQUIDO/),status:col(/STATUS/,/SITUACAO/),cod:col(/CODIGO (DA )?(VENDA|TRANSACAO)/,/^CODIGO/,/TRANSACAO/,/NSU/,/^ID/),parc:col(/PARCELA/),meio:col(/MEIO/,/FORMA/,/TIPO/,/BANDEIRA/)};
  if(C.data<0||C.bruto<0)throw new Error('Não achei as colunas de data e valor nesse arquivo.');
  const by=new Map();
  for(const r of rows.slice(hi+1)){
    const d=parseData(r[C.data]);const b=Math.abs(pnum(r[C.bruto]));if(!d||!b)continue;
    let tx=C.taxa>=0?Math.abs(pnum(r[C.taxa])):0;const lq=C.liq>=0?Math.abs(pnum(r[C.liq])):null;if(!tx&&lq!=null&&lq<b)tx=b-lq;
    const cod=C.cod>=0?String(r[C.cod]).trim()||null:null;const ptx=C.parc>=0?String(r[C.parc]):'';const pm=ptx.match(/(\d+)\s*(?:\/|de)\s*(\d+)/i)||(ptx.match(/(\d+)\s*x/i)?[0,0,ptx.match(/(\d+)\s*x/i)[1]]:/VISTA/.test(norm(ptx))?[0,0,1]:null);
    const it={data:d,bruto:b,taxa:+tx.toFixed(2),liquido:lq,status:C.status>=0?r[C.status].trim():null,codigo:cod,parcelas:pm?+pm[2]:(C.parc>=0?parseInt(r[C.parc])||null:null),meio:C.meio>=0?r[C.meio].trim():null};
    if(cod&&by.has(cod)){const o=by.get(cod);o.bruto+=b;o.taxa=+(o.taxa+it.taxa).toFixed(2);if(o.liquido!=null&&lq!=null)o.liquido+=lq;if(d<o.data)o.data=d}else by.set(cod||Symbol(),it);
  }
  return[...by.values()];
}
function importPag(){
  modal('Importar relatório do PagBank',`<div class="drop" id="pdrop">${ic('conta')}<p>Arraste o <b>.csv</b> de vendas do PagBank</p><label class="btn pri">${ic('up')}Escolher arquivo<input type="file" id="pf" accept=".csv,.txt" hidden></label></div><div id="pres" style="margin-top:14px"></div>`,null,{noFoot:true,wide:true});

  const dz=$('#pdrop');['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over')}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(f)go(f)});$('#pf').onchange=e=>e.target.files[0]&&go(e.target.files[0]);

      autoLigarCartao();closeModal();toast(`${rows.length} venda${rows.length==1?'':'s'} no cartão importada${rows.length==1?'':'s'}.`);render()}catch(e){toast(errMsg(e),true);b.disabled=false;b.textContent='Tentar de novo'}};

  }
}

let MODAL_CB=null;

async function okModal(){
  const b=$('#modal [data-act=okModal]');if(!MODAL_CB)return closeModal();
  const f=$('#modal form');if(f&&!f.reportValidity())return;
  const old=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{await MODAL_CB();closeModal()}catch(e){toast(errMsg(e),true);b.disabled=false;b.innerHTML=old}
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';MODAL_CB=null}
function toast(t,bad,undo){
  const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.innerHTML=`<span>${esc(t)}</span>${undo?'<button>Desfazer</button>':''}`;
  if(undo)el.querySelector('button').onclick=async()=>{el.remove();try{await undo();toast('Desfeito.')}catch(e){toast(errMsg(e),true)}};
  $('#toasts').appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},undo?6000:3500);
}

  const tb=e.target.closest('[data-tab]');if(tb){UI.contaTab=tb.dataset.tab;return render()}
  if(e.target===$('#modal'))return closeModal();
  const a=e.target.closest('[data-act]');if(!a)return;
  const id=a.dataset.id,act=a.dataset.act;
  if(['editNota','editProd','editForn'].includes(act)&&e.target.closest('button,input,select,a')&&e.target.closest('[data-act]')!==a)return;
  try{switch(act){
    case'closeModal':return closeModal();
    case'okModal':return okModal();
    case'novaNota':return notaForm();
    case'editNota':return notaForm(S.notas.find(n=>n.id===id));
    case'delNota':{e.stopPropagation();const n=S.notas.find(x=>x.id===id);if(!confirm(`Excluir a nota ${n.numero||''} de ${brl(n.valor)}?`))return;await del('notas',id);S.duplicatas=S.duplicatas.filter(d=>d.nota_id!==id);toast('Nota excluída.');return render()}
    case'importXml':return importXml();
    case'importHist':return importHist();
    case'copiarDiario':return copiarDiario();
    case'pagar':return pagar(a.dataset.k,id);
    case'despagar':await upd(a.dataset.k,id,{pago_em:null});toast('Voltou para em aberto.');return render();
    case'gerarFech':return gerarFech(a.dataset.f);
    case'quitarSel':return quitarSel(a.dataset.f);
    case'novaDespesa':return despesaForm();
    case'editDesp':return despesaForm(S.despesas.find(x=>x.id===id));
    case'delDesp':if(!confirm('Excluir esta despesa?'))return;await del('despesas',id);toast('Despesa excluída.');return render();
    case'novaProd':return prodForm();
    case'editProd':return prodForm(S.producao.find(x=>x.id===id));
    case'delProd':e.stopPropagation();if(!confirm('Excluir este lançamento?'))return;await del('producao',id);toast('Lançamento excluído.');return render();
    case'cfgCom':return cfgCom();
    case'delCom':await del('comissoes',id);closeModal();cfgCom();return render();
    case'mecs':return mecs();
    case'copiarSal':return copiarSal();
    case'novoParc':return parcForm();
    case'editParc':return parcForm(S.parcelamentos.find(x=>x.id===id));
    case'delParc':if(!confirm('Excluir este parcelamento?'))return;await del('parcelamentos',id);closeModal();toast('Parcelamento excluído.');return render();
    case'novoForn':return fornForm();
    case'editForn':return fornForm(F(id));
    case'backup':return backup();
    case'diaPrev':return shiftDia(-1);
    case'diaNext':return shiftDia(1);
    case'diaHoje':DIA=today();return render();
    case'novaOS':return osForm();
    case'editOS':return osForm(S.ordens.find(x=>x.id===id));
    case'delOS':{e.stopPropagation();const o=S.ordens.find(x=>x.id===id);if(!confirm(`Excluir a O.S. de ${o.cliente}?`))return;await del('ordens',id);S.producao=S.producao.filter(p=>p.ordem_id!==id);S.notas.forEach(n=>{if(n.ordem_id===id)n.ordem_id=null});S.cartao_mov.forEach(m=>{if(m.ordem_id===id)m.ordem_id=null});toast('O.S. excluída.');return render()}
    case'importPag':return importPag();
    case'cfgCustos':return cfgCustos();
    case'delMov':if(!confirm('Excluir esta venda do cartão?'))return;await del('cartao_mov',id);return render();
    case'copiarMensal':return copyText(mensalTSV(DIA)).then(()=>toast('Linha MENSAL copiada. Cole na coluna A do dia.'));
    case'copiarDiaDiario':return copiarDiaDiario();
    case'tema':return toggleTheme();
    case'sair':return sb.auth.signOut();
  }}catch(err){toast(errMsg(err),true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('resize',movePill);
function toggleTheme(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;lsSet('og.theme',nx)}
{const t=lsGet('og.theme',null);if(t)document.documentElement.dataset.theme=t}
$('#btnTheme').onclick=toggleTheme;
$('#btnOut').onclick=()=>sb.auth.signOut();

/* ================= AUTH / BOOT ================= */
function authMsg(t,cls){const m=$('#authMsg');m.hidden=!t;m.className='msg '+(cls||'');m.textContent=t||''}
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const b=e.target.querySelector('[type=submit]');b.disabled=true;authMsg('');
  const{error}=await sb.auth.signInWithPassword({email:o.email,password:o.senha});b.disabled=false;
  if(error)authMsg(/Invalid login/i.test(error.message)?'E-mail ou senha incorretos.':/not confirmed/i.test(error.message)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':error.message,'bad');
});
$('#btnSignup').onclick=async()=>{
  const f=$('#authForm');if(!f.reportValidity())return;const o=Object.fromEntries(new FormData(f));
  const{data,error}=await sb.auth.signUp({email:o.email,password:o.senha,options:{emailRedirectTo:location.protocol.startsWith('http')?location.origin:undefined}});
  if(error)return authMsg(error.message,'bad');
  if(!data.session)authMsg('Conta criada! Abra o e-mail que o Supabase enviou, clique no link de confirmação e depois volte aqui para entrar.','ok');
};
async function start(session){
  USER=session?.user||null;
  if(!USER){$('#app').hidden=true;$('#auth').hidden=false;return}
  $('#auth').hidden=true;$('#app').hidden=false;$('#who').textContent=USER.email;
  $('#view').innerHTML='<div class="loading"><span class="spin"></span></div>';
  try{await loadAll();await seed();render()}catch(e){$('#view').innerHTML=`<div class="card">${empty('alert','Não consegui carregar os dados: '+esc(errMsg(e)),'<button class="btn pri" onclick="location.reload()">Tentar de novo</button>')}</div>`}
}
if(!window.supabase){document.body.innerHTML='<div style="padding:40px;font-family:system-ui">Sem internet: não consegui carregar o sistema. Verifique a conexão e recarregue a página.</div>'}
else{
  sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  let lastUid;
  sb.auth.onAuthStateChange((ev,session)=>{const uid=session?.user?.id||null;if(uid===lastUid&&ev!=='SIGNED_OUT')return;lastUid=uid;setTimeout(()=>start(session),0)});
}
</script>
</body>
</html>
